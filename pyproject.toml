[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "issue-autopilot"
version = "0.1.0"
description = "Turn repo signals (TODOs, failing CI, stale deps, stale PRs, leaked secrets) into deduped GitHub issues."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["tomli>=1.1; python_version < '3.11'"]

[project.optional-dependencies]
llm = ["anthropic>=1.0"]
dev = ["pytest>=7"]

[project.scripts]
autopilot = "issue_autopilot.cli:main"

[tool.setuptools.packages.find]
include = ["issue_autopilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
